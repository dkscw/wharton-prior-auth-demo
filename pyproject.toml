[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-auth-ai-demo"
version = "0.1.0"
description = "Streamlit teaching simulator for prior-authorization AI workflow economics"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prior_auth*"]
